{% extends 'core/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-recycle"></i> Envases Retornables</h2>
        <a href="{% url 'crear_envase' %}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Nuevo Envase
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nombre del Envase</th>
                        <th>Valor Depósito ($)</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for envase in envases %}
                    <tr>
                        <td class="ps-4 fw-bold">{{ envase.nombre }}</td>
                        <td>
                            <span class="badge bg-success rounded-pill">${{ envase.valor_deposito }}</span>
                        </td>
                        <td class="text-end pe-4">
                            <a href="{% url 'editar_envase' envase.id %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <form action="{% url 'eliminar_envase' envase.id %}" method="POST" class="d-inline" onsubmit="return confirm('¿Borrar envase?');">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="text-center py-4">No hay envases cargados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
